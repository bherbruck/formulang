name: Deploy Playground to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build WASM package
        run: wasm-pack build --target web --features wasm
        working-directory: crates/formulang-lang

      - name: Debug - show WASM package
        run: ls -la crates/formulang-lang/pkg/ && cat crates/formulang-lang/pkg/package.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install all dependencies
        run: |
          cd packages/formulang-monaco && bun install --no-save
          cd ../formulang-playground && bun install --no-save

      - name: Debug - show installed formulang-lang
        run: |
          ls -la packages/formulang-playground/node_modules/formulang-lang/ || echo "Not found in playground"
          ls -la packages/formulang-monaco/node_modules/formulang-lang/ || echo "Not found in monaco"

      - name: Build formulang-monaco
        run: bun run build
        working-directory: packages/formulang-monaco

      - name: Build playground
        run: bun run build
        working-directory: packages/formulang-playground

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/formulang-playground/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
